[package]
name = "moe_opt"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.furiosa-opt]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("emulation", "npu", "typecheck"))', 'cfg(furiosa_opt)'] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "tiny"
path = "src/tiny.rs"

[dependencies]
eyre = "0.6"
furiosa-opt-std = "=0.9.0"
furiosa-opt-rt = "=0.9.0"
rand = "0.9"
half = "2"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
futures = "0.3"
log = "0.4"

[profile.release]
debug = false

[[bin]]
name = "rt_bench"
path = "src/rt_bench.rs"

[[bin]]
name = "gemv_bench"
path = "src/gemv_bench.rs"

[[bin]]
name = "ffn_bench"
path = "src/ffn_bench.rs"

[[bin]]
name = "k8_bench"
path = "src/k8_bench.rs"

[[bin]]
name = "fko_eval"
path = "src/fko_eval.rs"
