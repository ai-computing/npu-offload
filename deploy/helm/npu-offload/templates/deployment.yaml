{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npu-offload.fullname" . }}
  labels:
    {{- include "npu-offload.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "npu-offload.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "npu-offload.selectorLabels" . | nindent 8 }}
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: {{ .Values.model.name | quote }}
        llm-d.ai/role: {{ .Values.llmd.role | quote }}
      annotations:
        airm.ai-computing.io/scrape: "true"
        airm.ai-computing.io/port: {{ .Values.airm.metricsPort | quote }}
    spec:
      affinity:
        nodeAffinity:
          {{- if .Values.nodeAffinity }}
          {{- toYaml .Values.nodeAffinity | nindent 10 }}
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: airm.ai-computing.io/furiosa.RNGD, operator: Exists}
          {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository | default "npu-offload-worker" }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["python3", "-m", "moe_offload.cli", "airm", "--kind", "serve", "--model", {{ .Values.model.name | quote }},
                    "engine={{ .Values.engine.binary }}", "data={{ .Values.engine.data }}", "hf_dir={{ .Values.model.path }}",
                    "host=0.0.0.0", "port={{ .Values.port }}", "metrics_port={{ .Values.airm.metricsPort }}",
                    "kv_transport={{ .Values.airm.kvTransport }}", {{ printf "env=%s" (toJson .Values.engine.env) | quote }}]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.port }}}
            - {name: metrics, containerPort: {{ .Values.airm.metricsPort }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 180
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.model.volume }}
            - {name: model, mountPath: {{ .Values.model.path }}, readOnly: true}
            {{- end }}
            {{- if .Values.dmaHeap }}
            - {name: dmaheap, mountPath: /dev/dma_heap}
            {{- end }}
      volumes:
        {{- if .Values.model.volume }}
        - name: model
          {{- toYaml .Values.model.volume | nindent 10 }}
        {{- end }}
        {{- if .Values.dmaHeap }}
        - {name: dmaheap, hostPath: {path: /dev/dma_heap}}
        {{- end }}
{{- end }}
