[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-offload"
version = "0.1.0"
description = "Tiered MoE expert offloading (accelerator HBM + host CPU) with an llm-d style serving layer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["torch", "transformers"]

[project.scripts]
moe-offload = "moe_offload.cli:main"

[tool.setuptools.packages.find]
include = ["moe_offload*"]
