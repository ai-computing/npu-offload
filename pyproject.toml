[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-offload"
version = "0.1.0"
description = "Tiered MoE expert offloading (accelerator HBM + host CPU) with an llm-d style serving layer"
requires-python = ">=3.10"
dependencies = ["rm-core @ git+https://github.com/ai-computing/rm-core@v0.1.0"]

[project.optional-dependencies]
model = ["torch", "transformers"]

[project.scripts]
moe-offload = "moe_offload.cli:main"

[project.entry-points."airm.workloads"]
npu-offload = "moe_offload.airm:serve"

[tool.setuptools.packages.find]
include = ["moe_offload*"]
