name: npu-offload
protocol: "0.1"
layer: l2-memory
kind: service
summary: MoE hot expert는 NPU HBM에, cold expert는 호스트 CPU에 두는 expert 오프로딩 엔진과 배치 플래너, OpenAI 호환 워커, expert-affinity 게이트웨이
maturity: prototype
hardware: [RNGD]
install:
  - python -m pip install -e .
test:                         # NPU-free; needs RNGD_LLMD (cluster.local.env) for the gateway test
  - python -m moe_offload.tests.run
adapters:                     # rm-core entry points (moe_offload/airm.py)
  - group: airm.workloads
    name: npu-offload         # kind serve | decode; config keys in README "## ai-rm"
deploy:
  target: llm-d
  chart: deploy/helm/npu-offload   # decode ModelService worker; not yet run on a cluster
  manifests: null             # older untested sketch: moe_offload/deploy/k8s-moe-worker.yaml
  image: null
metrics: [tok_s, tpot_p50_ms, tpot_p90_ms, power_w]
config:
  env_example: cluster.example.env
interfaces:
  provides: [MemoryTier, Placement, Metrics]
  uses: [rm-core]
kpi: [이종자원수, SLO]
